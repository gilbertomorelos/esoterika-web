<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elige tu carta · Esoterika Umbra Arcana</title>
<meta name="theme-color" content="#0b0710">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0710;--vino:#5a1426;--mor:#3b1659;--oro:#c9a45c;--oro2:#8c6d34;--humo:#b9aec4;--txt:#e9e1ee;--serif:'Cinzel',serif;--cur:'Cormorant Garamond',Georgia,serif;--sans:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% 40%,rgba(59,22,89,.5),transparent 70%),var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.6;min-height:100svh;padding:40px 20px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:.06em;line-height:1.2}
.wrap{max-width:900px;margin:0 auto}
.center{text-align:center}
.eyebrow{font-family:var(--serif);color:var(--oro);letter-spacing:.35em;font-size:.72rem;text-transform:uppercase;display:block;margin-bottom:16px}
h1{font-size:clamp(1.8rem,6vw,2.8rem);color:#f3e7c9;margin-bottom:14px}
.lead{font-family:var(--cur);font-style:italic;font-size:clamp(1.1rem,4vw,1.4rem);color:var(--humo);margin-bottom:30px}
.deck{display:flex;justify-content:center;gap:20px;margin:40px 0;perspective:1200px;flex-wrap:wrap}
.pick{width:min(29vw,150px);aspect-ratio:2/3.3;border:0;background:none;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,.7,.2,1),opacity .8s,filter .8s}
.pick .f{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--oro);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;text-align:center}
.pick .back{background:repeating-linear-gradient(45deg,rgba(201,164,92,.07) 0 6px,transparent 6px 12px),linear-gradient(160deg,var(--mor),#14061f);box-shadow:inset 0 0 0 5px #0b0710,inset 0 0 0 6px rgba(201,164,92,.5)}
.pick .back svg{width:52%;stroke:var(--oro);fill:none;stroke-width:1.4}
.pick .front{transform:rotateY(180deg);background:linear-gradient(160deg,#2a1040,var(--vino));box-shadow:0 0 40px rgba(201,164,92,.4)}
.pick .front b{font-family:var(--serif);font-size:clamp(.62rem,2.8vw,.9rem);color:#f3e7c9;letter-spacing:.1em}
.pick .front span{font-size:2.1rem;color:var(--oro)}
.deck:not(.done) .pick:hover{transform:translateY(-12px) rotate(-1.5deg);filter:drop-shadow(0 0 18px rgba(201,164,92,.5))}
.pick.flip{transform:rotateY(180deg) translateY(-8px)}
.deck.done .pick:not(.flip){opacity:.25;filter:grayscale(1)}
.teaser{max-width:560px;margin:30px auto;padding:30px 24px;border:1px solid rgba(201,164,92,.4);border-radius:8px;background:linear-gradient(160deg,rgba(90,20,38,.4),rgba(11,7,16,.92));display:none}
.teaser.on{display:block;animation:fadeIn .6s}
.teaser .simbolo{text-align:center;color:var(--oro);font-size:3rem;margin-bottom:8px}
.teaser h3{color:var(--oro);font-size:1.5rem;margin-bottom:12px;text-align:center}
.teaser .frase{font-family:var(--cur);font-style:italic;font-size:1.3rem;color:#f3e7c9;text-align:center;margin-bottom:18px;line-height:1.5}
.teaser .pregunta{color:var(--humo);text-align:center;font-size:.95rem;padding-top:18px;border-top:1px solid rgba(201,164,92,.2)}
.teaser .btn{margin-top:18px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.productos{margin:40px 0 30px;display:none}
.productos.on{display:block}
.productos h2{font-size:1.3rem;color:var(--oro);text-align:center;margin-bottom:10px}
.productos .sub-msg{text-align:center;color:var(--humo);font-family:var(--cur);font-style:italic;font-size:1.1rem;margin-bottom:24px}
.productos-grid{display:grid;gap:16px}
@media(min-width:600px){.productos-grid{grid-template-columns:repeat(3,1fr)}}
.prod{padding:20px;border:1px solid rgba(201,164,92,.3);border-radius:8px;background:rgba(11,7,16,.6);cursor:pointer;transition:all .3s;text-align:center;position:relative}
.prod:hover{border-color:var(--oro);background:rgba(59,22,89,.4)}
.prod.selected{border-color:var(--oro);background:rgba(90,20,38,.5);box-shadow:0 0 24px rgba(201,164,92,.4)}
.prod h3{color:#f3e7c9;font-size:1.05rem;margin-bottom:8px}
.prod p{color:var(--humo);font-size:.85rem;margin-bottom:10px;min-height:2.5em}
.prod .precio{color:var(--oro);font-family:var(--serif);font-size:1.4rem}
.continuar{display:none;margin-top:30px}
.continuar.on{display:block}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;border:1px solid var(--oro);color:#f3e7c9;background:linear-gradient(135deg,rgba(90,20,38,.85),rgba(59,22,89,.85));font-family:var(--serif);letter-spacing:.2em;font-size:.8rem;text-decoration:none;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all .3s;width:100%}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(201,164,92,.35)}
.btn.ghost{background:transparent;border-color:rgba(201,164,92,.5)}
.elegir-otra{text-align:center;margin-top:20px}
.elegir-otra button{background:none;border:none;color:var(--oro2);font-family:var(--serif);font-size:.85rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;padding:10px 20px}
.elegir-otra button:hover{color:var(--oro)}
.back-link{color:var(--oro2);text-decoration:none;font-size:.85rem;display:inline-block;margin-top:30px;text-align:center;width:100%}
.back-link:hover{color:var(--oro)}
</style>
</head>
<body>
<div class="wrap">
  <div class="center">
    <span class="eyebrow">El oráculo te espera</span>
    <h1>TU TIRADA GRATUITA</h1>
    <p class="lead">Concéntrate en tu pregunta.<br>Toca la carta que te llame.</p>
  </div>

  <div class="deck" id="deck"></div>

  <div class="teaser" id="teaser">
    <div class="simbolo" id="teaserSimbolo"></div>
    <h3 id="teaserNombre"></h3>
    <p class="frase" id="teaserTexto"></p>
    <p class="pregunta">¿Quieres saber qué más tiene que decirte esta carta?</p>
    <button class="btn" id="btnQuiero">Quiero mi lectura completa</button>
  </div>

  <div class="elegir-otra" id="elegirOtra" style="display:none">
    <button onclick="location.reload()">← Elegir otra carta</button>
  </div>

  <div class="productos" id="productos">
    <h2>Elige tu lectura</h2>
    <p class="sub-msg">Cada lectura tiene un enfoque distinto.</p>
    <div class="productos-grid" id="productosGrid"></div>
  </div>

  <div class="continuar" id="continuar">
    <button class="btn" id="btnContinuar" disabled>Continuar con mi lectura</button>
  </div>

  <div class="center">
    <a href="index.html" class="back-link">← Volver al inicio</a>
  </div>
</div>

<script>
let TAROT = null;
let cartaElegida = null;
let productoElegido = null;

fetch('tarot.json').then(r => r.json()).then(data => {
  TAROT = data;
  document.title = 'Elige tu carta · ' + TAROT.config.brand;
  dealCards();
});

function dealCards() {
  const deck = document.getElementById('deck');
  const nombres = Object.keys(TAROT.cartas);
  const pool = [...nombres].sort(() => Math.random() - .5).slice(0, 3);

  deck.innerHTML = pool.map(nombre => {
    const c = TAROT.cartas[nombre];
    return `<button class="pick" data-nombre="${nombre}">
      <div class="f back"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="18" fill="none" stroke="#c9a45c" stroke-width="2"/><path d="M50 8v14M50 78v14M8 50h14M78 50h14" stroke="#c9a45c" stroke-width="2"/></svg></div>
      <div class="f front"><span>${c.s}</span><b>${nombre.toUpperCase()}</b></div>
    </button>`;
  }).join('');

  deck.querySelectorAll('.pick').forEach(el => el.onclick = () => {
    if (deck.classList.contains('done')) return;
    const nombre = el.dataset.nombre;
    const c = TAROT.cartas[nombre];
    cartaElegida = nombre;

    deck.classList.add('done'); el.classList.add('flip');

    document.getElementById('teaserSimbolo').textContent = c.s;
    document.getElementById('teaserNombre').textContent = c.n;
    document.getElementById('teaserTexto').textContent = '"' + c.teaser + '"';
    document.getElementById('teaser').classList.add('on');
    document.getElementById('elegirOtra').style.display = 'block';

    document.getElementById('teaser').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

document.getElementById('btnQuiero').onclick = () => {
  document.getElementById('productosGrid').innerHTML = TAROT.productos.map(p => `
    <div class="prod" data-id="${p.id}" data-nombre="${p.nombre}">
      <h3>${p.nombre}</h3>
      <p>${p.desc}</p>
      <div class="precio">$${p.precio} ${TAROT.config.currency}</div>
    </div>
  `).join('');

  document.getElementById('productosGrid').querySelectorAll('.prod').forEach(p => {
    p.onclick = () => {
      document.getElementById('productosGrid').querySelectorAll('.prod').forEach(x => x.classList.remove('selected'));
      p.classList.add('selected');
      productoElegido = { id: p.dataset.id, nombre: p.dataset.nombre };
      document.getElementById('continuar').classList.add('on');
      document.getElementById('btnContinuar').disabled = false;
    };
  });

  document.getElementById('productos').classList.add('on');
  document.getElementById('productos').scrollIntoView({ behavior: 'smooth', block: 'start' });
};

document.getElementById('btnContinuar').onclick = () => {
  if (!cartaElegida || !productoElegido) return;
  localStorage.setItem('esoterika_carta', cartaElegida);
  localStorage.setItem('esoterika_producto', productoElegido.nombre);
  localStorage.setItem('esoterika_producto_id', productoElegido.id);
  window.location.href = 'registro.html';
};
</script>
</body>
</html>
